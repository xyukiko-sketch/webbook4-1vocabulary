<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Book 4-1 Vocabulary App</title>
<style>
:root{--primary:#2563eb;--good:#15803d;--bad:#b91c1c;--ink:#172033;--muted:#667085;--line:#d9e1ec;--panel:#fff;--bg:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Segoe UI","Yu Gothic UI",sans-serif;color:var(--ink)}
.app{max-width:920px;margin:auto;padding:22px}
header{text-align:center;margin-bottom:14px}
h1{margin:0;font-size:clamp(25px,4vw,38px)} .sub{color:var(--muted);margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px #23405d12}
.settings,.tabs,.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.settings{margin:14px 0}
select,button,label{font:inherit}
.select,.toggle{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:11px}
.toggle{font-weight:700}
.btn,.tab,.option{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:800}
.tab{background:#e8eef8;color:#38506f} .tab.active{background:var(--primary);color:#fff}
.btn.primary{background:var(--primary);color:#fff} .btn.secondary{background:#e8eef8;color:#30445f}
.btn.good{background:var(--good);color:#fff} .btn.bad{background:#fff0f0;color:var(--bad);border:1px solid #fecaca}
.btn.remember{background:#7c3aed;color:#fff}
.btn.training{background:#ea580c;color:#fff}
.hint-card{margin:16px auto 0;max-width:700px;background:#fffaf0;border:1px solid #fed7aa;border-radius:16px;padding:16px;text-align:left}
.hint-title{font-weight:900;color:#b45309;margin-bottom:8px}
.hint-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint-label{font-size:12px;font-weight:900;color:#7c2d12;text-transform:uppercase}
.hint-text{margin-top:3px;color:#3f3f46}
.weak-badge{display:inline-block;background:#ffedd5;color:#9a3412;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;margin-left:6px}
.hidden{display:none!important}
.word{text-align:center;font-size:clamp(34px,7vw,58px);font-weight:900;margin-top:12px}
.ipa,.small,.counter{text-align:center;color:var(--muted)} .ipa{font-size:19px;margin:8px}
.word-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 2px}
.stat-chip{background:#eef4ff;border:1px solid #cfe0ff;border-radius:999px;padding:6px 11px;font-size:14px;font-weight:800;color:#34527d}
.streak-chip{background:#fff7ed;border-color:#fed7aa;color:#b45309}
.answer{text-align:center;font-size:28px;font-weight:900;margin:20px 0 5px}
.example{text-align:center;color:#4b5c73;min-height:28px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.option{background:#fff;border:2px solid var(--line);min-height:62px;font-size:17px}
.option:hover{border-color:#8eade0} .option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{text-align:center;font-size:21px;font-weight:900;min-height:34px;margin-top:15px}
.timer-wrap{margin:14px auto 2px;max-width:420px}
.timer-label{text-align:center;font-weight:900;color:#b45309;margin-bottom:5px}
.timer-track{height:12px;background:#fde7c7;border-radius:999px;overflow:hidden;border:1px solid #fed7aa}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);transform-origin:left center}
.progress{height:10px;background:#e3e9f2;border-radius:999px;overflow:hidden;margin:16px 0}
.progress>div{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);width:0;transition:.3s}
.row{display:grid;grid-template-columns:1.1fr 1.7fr auto;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:14px 5px}
.badge{padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:13px;font-weight:800}
.badge.mastered{background:#dcfce7;color:#166534}
.speak{background:#fff;border:1px solid var(--line);color:#274263}
.stats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:12px 0;color:#465a75;font-weight:800}
.celebration{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti{position:absolute;top:-20px;width:10px;height:17px;animation:fall 1.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--d),105vh) rotate(720deg);opacity:.1}}
.streak-pop{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);z-index:120;pointer-events:none;
  font-size:clamp(30px,7vw,62px);font-weight:1000;color:#f59e0b;text-shadow:0 4px 0 #fff,0 8px 24px #f59e0b88;
  animation:streakPop .95s cubic-bezier(.18,.89,.32,1.28) forwards}
@keyframes streakPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-8deg)}
45%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(4deg)}
75%{transform:translate(-50%,-50%) scale(.96) rotate(-2deg)}
100%{opacity:0;transform:translate(-50%,-62%) scale(1.05)}}
.star-burst{position:fixed;left:50%;top:33%;z-index:119;pointer-events:none;font-size:30px;
  animation:starBurst 1s ease-out forwards}
@keyframes starBurst{from{opacity:1;transform:translate(-50%,-50%) rotate(0) translateX(0) scale(.5)}
to{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translateX(var(--x)) scale(1.35)}}
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.dash-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.dash-card b{display:block;font-size:26px}.goal-box{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:18px;padding:16px;margin:14px 0}.goal-title{text-align:center;font-weight:900;font-size:19px}.complete{text-align:center;padding:34px}
.result-score{font-size:clamp(28px,6vw,46px);font-weight:1000;margin:12px 0 6px}
.result-rate{font-size:clamp(22px,5vw,34px);font-weight:900;margin:4px 0 12px}
.result-message{font-size:18px;font-weight:800;color:#465a75;margin:10px 0 18px}
.result-pop{animation:resultPop .9s cubic-bezier(.18,.89,.32,1.28)}
@keyframes resultPop{0%{opacity:0;transform:scale(.55)}55%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
.result-star{position:fixed;z-index:125;pointer-events:none;font-size:30px;animation:resultStar 1.4s ease-out forwards}
@keyframes resultStar{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(1.25)}}.complete .trophy{font-size:72px}.complete h2{font-size:34px;margin:8px 0}.btn.boss{background:#7c2d12;color:#fff}@media(max-width:650px){.options{grid-template-columns:1fr}.row{grid-template-columns:1fr}.dashboard{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="celebration" class="celebration"></div>
<div id="streakLayer"></div>
<div class="app">
<header><h1>Web Book 4-1 Vocabulary</h1><div class="sub">読み上げ・4択・5回連続正解で習得・翌日から間隔復習</div></header>

<div class="dashboard">
  <div class="dash-card">今日の問題<b id="todayCount">0/50</b></div>
  <div class="dash-card">覚えた単語<b id="masteredCount">0</b></div>
  <div class="dash-card">復習待ち<b id="dueCount">0</b></div>
  <div class="dash-card">正答率<b id="accuracy">–</b></div>
</div>
<div class="goal-box"><div class="goal-title" id="goalTitle">今日の目標：50問</div><div class="progress"><div id="dailyBar"></div></div><div class="small" id="goalNote">50問終了後に今日の正解数と正答率を表示します。</div></div>

<div class="settings">
  <select id="direction" class="select">
    <option value="en-ja">英語 → 日本語</option>
    <option value="ja-en">日本語 → 英語</option>
  </select>
  <select id="filter" class="select">
    <option value="due">今日の復習</option><option value="review">覚えていない単語だけ</option>
    <option value="all">すべての単語</option>
    <option value="mastered">覚えた単語だけ</option>
  </select>
  <label class="toggle"><input id="autoSpeak" type="checkbox" checked> 自動読み上げ</label>
  <label class="toggle"><input id="soundEffects" type="checkbox" checked> 効果音</label>
<label class="toggle"><input id="showHints" type="checkbox"> ヒント表示</label>
  <button id="trainingBtn" class="btn training">🔥 苦手特訓</button><button id="bossBtn" class="btn boss">👑 ボス戦</button>
<button id="shuffleBtn" class="btn secondary">シャッフル</button>
  <button id="resetBtn" class="btn secondary">履歴をリセット</button>
</div>

<div class="tabs">
  <button class="tab active" data-mode="flash">フラッシュカード</button>
  <button class="tab" data-mode="quiz">4択クイズ</button>
  <button class="tab" data-mode="list">単語一覧</button>
</div>

<div class="progress"><div id="bar"></div></div>

<section id="flashView" class="panel">
  <div id="flashCounter" class="counter"></div>
  <div id="flashWordStats" class="word-stats"></div>
  <div id="flashPrompt" class="word"></div>
  <div id="flashIpa" class="ipa"></div>
  <div class="controls"><button id="speakFlash" class="btn speak">🔊 読み上げ</button></div>
  <div id="flashAnswerArea" class="hidden">
    <div id="flashAnswer" class="answer"></div>
    <div id="flashExample" class="example"></div>
  </div>
  <div id="flashControls" class="controls" style="margin-top:20px"></div>
<div id="flashHint" class="hint-card hidden"></div>
</section>

<section id="quizView" class="panel hidden">
  <div id="quizCounter" class="counter"></div>
  <div id="quizWordStats" class="word-stats"></div>
  <div id="quizPrompt" class="word"></div>
  <div id="quizIpa" class="ipa"></div>
  <div class="controls"><button id="speakQuiz" class="btn speak">🔊 読み上げ</button></div>
  <div id="quizTimer" class="timer-wrap"><div id="timerLabel" class="timer-label">残り 4.0 秒</div><div class="timer-track"><div id="timerBar" class="timer-bar"></div></div></div><div id="options" class="options"></div>
  <div id="feedback" class="feedback"></div>
<div id="quizHint" class="hint-card hidden"></div>
  
</section>

<section id="listView" class="panel hidden">
  <div class="small" style="margin-bottom:12px">「覚えた」を押すと手動で除外できます。5回連続正解した単語は通常学習から除外され、翌日0時から「今日の復習」に再登場します。</div>
  <div id="wordList"></div>
</section>
<section id="completeView" class="panel hidden complete"><div id="resultIcon" class="trophy">🏆</div><h2 id="resultTitle">今日の学習完了！</h2><div id="resultScore" class="result-score"></div><div id="resultRate" class="result-rate"></div><div id="resultMessage" class="result-message"></div><button id="continueBtn" class="btn primary">追加で練習する</button></section>
</div>

<script>

const hintData={
  "explicitly":{
    origin:"ex-（外へ）＋ plic（折りたたむ）→ 折りたたんだものを外へ広げる",
    image:"折りたたんだ紙をパッと広げ、誰にでも見えるようにする",
    memory:"explicitly = はっきりと、明示的に",
    example:"The rule explicitly prohibits smoking."
  },
  "leverage":{
    origin:"lever（てこ）から生まれた語",
    image:"小さな力を、てこの力で大きな成果に変える",
    memory:"leverage = 強みや資源を最大限に活用する",
    example:"Schools can leverage technology to improve learning."
  }
};

const words=[
{w:'array',ipa:'/əˈreɪ/',pos:'n.',ja:'多様なもの、一連',ex:'an array of methods'},
{w:'be poised to',ipa:'—',pos:'熟語',ja:'～する態勢が整っている',ex:'be poised to play a crucial role'},
{w:'continual',ipa:'/kənˈtɪnjuəl/',pos:'adj.',ja:'継続的な',ex:'continual change'},
{w:'coverage',ipa:'/ˈkʌvərɪdʒ/',pos:'n.',ja:'分布面積、被覆',ex:'global coverage'},
{w:'dwindle',ipa:'/ˈdwɪndl/',pos:'v.',ja:'徐々に減少する',ex:'dwindle at an alarming rate'},
{w:'ecological restoration',ipa:'—',pos:'n.',ja:'生態系修復',ex:'restoration efforts'},
{w:'embrace',ipa:'/ɪmˈbreɪs/',pos:'v.',ja:'積極的に受け入れる',ex:'embrace change'},
{w:'endeavor',ipa:'/ɪnˈdevər/',pos:'n.',ja:'取り組み、努力',ex:'restoration endeavors'},
{w:'evident',ipa:'/ˈevɪdənt/',pos:'adj.',ja:'明らかな',ex:'become evident'},
{w:'explicitly',ipa:'/ɪkˈsplɪsɪtli/',pos:'adv.',ja:'明示的に',ex:'explicitly consider'},
{w:'fundamental',ipa:'/ˌfʌndəˈmentl/',pos:'adj.',ja:'根本的に重要な',ex:'be fundamental'},
{w:'harness',ipa:'/ˈhɑːrnəs/',pos:'v.',ja:'有効活用する',ex:'harness ecological interactions'},
{w:'hold promise',ipa:'—',pos:'熟語',ja:'将来性がある',ex:'hold significant promise'},
{w:'imperative',ipa:'/ɪmˈperətɪv/',pos:'adj.',ja:'不可欠な',ex:'it is imperative to'},
{w:'incorporate A into B',ipa:'—',pos:'熟語',ja:'AをBに組み込む',ex:'incorporate A into B'},
{w:'investment',ipa:'/ɪnˈvestmənt/',pos:'n.',ja:'投資、投入',ex:'resource investment'},
{w:'leverage',ipa:'/ˈlevərɪdʒ/',pos:'v.',ja:'最大限に活用する',ex:'leverage resources'},
{w:'navigate',ipa:'/ˈnævɪɡeɪt/',pos:'v.',ja:'（困難を）乗り越える',ex:'navigate challenges'},
{w:'nonetheless',ipa:'/ˌnʌnðəˈles/',pos:'adv.',ja:'それにもかかわらず',ex:'Nonetheless, ...'},
{w:'nursery habitat',ipa:'—',pos:'n.',ja:'生育場、育成場所',ex:'serve as a nursery habitat'},
{w:'ongoing',ipa:'/ˈɑːnˌɡoʊɪŋ/',pos:'adj.',ja:'進行中の',ex:'ongoing research'},
{w:'pivotal',ipa:'/ˈpɪvətl/',pos:'adj.',ja:'極めて重要な',ex:'play a pivotal role'},
{w:'prosperity',ipa:'/prɑːˈsperəti/',pos:'n.',ja:'繁栄、発展',ex:'ensure prosperity'},
{w:'restoration strategy',ipa:'—',pos:'n.',ja:'修復戦略',ex:'restoration strategy'},
{w:'sequester (carbon)',ipa:'/sɪˈkwestər/',pos:'v.',ja:'（炭素を）固定する',ex:'sequester carbon'},
{w:'stressor',ipa:'/ˈstresər/',pos:'n.',ja:'ストレス要因',ex:'environmental stressors'},
{w:'transformation',ipa:'/ˌtrænsfərˈmeɪʃn/',pos:'n.',ja:'変化、変革',ex:'ongoing transformations'},
{w:'undergo',ipa:'/ˌʌndərˈɡoʊ/',pos:'v.',ja:'経験する',ex:'undergo changes'}];
const $=id=>document.getElementById(id);
const storageKey='wb41_vocab_progress_v7';
const previousKeys=['wb41_vocab_progress_v5','wb41_vocab_progress_v4','wb41_vocab_progress_v2','wb41_vocab_progress_v1'];
const prefsKey='wb41_vocab_audio_v1';

function loadState(){
  let s=JSON.parse(localStorage.getItem(storageKey)||'null');
  if(!s){
    for(const key of previousKeys){
      const old=JSON.parse(localStorage.getItem(key)||'null');
      if(old){s=old;break}
    }
  }
  if(!s)s={mastered:{},correct:0,total:0,wordStats:{},daily:{date:'',count:0,correct:0,bossDone:false,finished:false}};
  if(!s.mastered)s.mastered={};
  if(!s.wordStats)s.wordStats={};
  if(!s.daily)s.daily={date:'',count:0,correct:0,bossDone:false,finished:false};
  if(typeof s.correct!=='number')s.correct=0;
  if(typeof s.total!=='number')s.total=0;
  if(typeof s.daily.correct!=='number')s.daily.correct=0;
  if(typeof s.daily.finished!=='boolean')s.daily.finished=false;
  return s;
}

let state=loadState();
let prefs=JSON.parse(localStorage.getItem(prefsKey)||'{"autoSpeak":true,"soundEffects":true,"showHints":false}');
let mode='flash',deck=[],index=0,answered=false,advanceTimer=null,questionTimer=null,timerInterval=null,questionStartedAt=0,trainingMode=false,bossMode=false;
const DAILY_GOAL=50,BOSS_COUNT=5,DAY=86400000;

$('autoSpeak').checked=prefs.autoSpeak!==false;
$('soundEffects').checked=prefs.soundEffects!==false;
$('showHints').checked=prefs.showHints===true;

function normalizeWordStats(w){
  const current=state.wordStats[w]||{};
  state.wordStats[w]={
    attempts:Number(current.attempts)||0,
    correct:Number(current.correct)||0,
    streak:Number(current.streak)||0,
    level:Number(current.level)||0,
    due:Number(current.due)||Date.now(),
    errors:Number(current.errors)||0
  };
  return state.wordStats[w];
}
words.forEach(x=>normalizeWordStats(x.w));

function save(){
  localStorage.setItem(storageKey,JSON.stringify(state));
  updateStats();
}
function savePrefs(){
  prefs.autoSpeak=$('autoSpeak').checked;
  prefs.soundEffects=$('soundEffects').checked;
  prefs.showHints=$('showHints').checked;
  localStorage.setItem(prefsKey,JSON.stringify(prefs));
}
$('autoSpeak').onchange=savePrefs;
$('soundEffects').onchange=savePrefs;
$('showHints').onchange=()=>{savePrefs();render()};


function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function nextLocalDayStart(){
  const d=new Date();
  d.setHours(24,0,0,0);
  return d.getTime();
}
function ensureDaily(){if(state.daily.date!==todayKey())state.daily={date:todayKey(),count:0,correct:0,bossDone:false,finished:false}}
ensureDaily();
function levelDelay(level){return [0,0,DAY,3*DAY,7*DAY,14*DAY,30*DAY][Math.min(6,level)]}
function scheduleCorrect(x){const s=statsOf(x.w);s.level=s.streak>=5?Math.max(s.level,5):s.streak>=3?Math.max(s.level,3):s.streak>=2?Math.max(s.level,2):Math.max(s.level,1);s.due=Date.now()+levelDelay(s.level)}
function scheduleWrong(x){const s=statsOf(x.w);s.errors++;s.level=Math.max(0,s.level-2);s.due=Date.now()}
function isDue(x){return statsOf(x.w).due<=Date.now()}
function recordDaily(ok=false){
  if(bossMode||state.daily.finished)return;
  if(state.daily.count<DAILY_GOAL){
    state.daily.count++;
    if(ok)state.daily.correct++;
  }
}
function bossWords(){return words.filter(x=>!state.mastered[x.w]).sort((a,b)=>weakScore(b.w)-weakScore(a.w)).slice(0,BOSS_COUNT)}
function startBoss(){bossMode=true;deck=shuffle(bossWords());index=0;mode='quiz';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode==='quiz'));render()}
function maybeFinishDaily(){
  if(!bossMode && !state.daily.finished && state.daily.count>=DAILY_GOAL){
    state.daily.finished=true;
    showComplete();
    return true;
  }
  return false;
}
function resultSound(rate){
  if(!$('soundEffects').checked)return;

  // 50問完了用の派手なファンファーレ
  if(rate>=90){
    // 高得点：上昇アルペジオ → 高音の祝砲 → 締めの和音
    [
      [523,0,.14],[659,.08,.14],[784,.16,.14],[1047,.24,.18],
      [1319,.36,.20],[1568,.48,.22],[2093,.62,.34],
      [1047,.82,.20],[1319,.82,.20],[1568,.82,.20],
      [1319,1.06,.18],[1568,1.06,.18],[2093,1.06,.38]
    ].forEach(x=>tone(...x,.15));
  }else if(rate>=70){
    // 標準達成：明るいファンファーレ
    [
      [523,0,.14],[659,.10,.14],[784,.20,.18],
      [1047,.34,.24],[784,.56,.14],[1047,.68,.18],
      [1319,.82,.34],[659,1.02,.22],[988,1.02,.22],[1319,1.02,.30]
    ].forEach(x=>tone(...x,.13));
  }else{
    // 50問完走：励ましつつ達成感のあるジングル
    [
      [392,0,.16],[494,.14,.16],[523,.28,.18],
      [659,.46,.22],[523,.68,.16],[659,.80,.18],
      [784,.94,.34]
    ].forEach(x=>tone(...x,.11));
  }
}
function resultAnimation(rate){
  const layer=$('streakLayer');
  layer.innerHTML='';
  const count=rate>=90?24:rate>=70?14:8;
  const symbols=rate>=90?['🌟','✨','🎉']:rate>=70?['⭐','✨']:['✨','💫'];
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.className='result-star';
    s.textContent=symbols[i%symbols.length];
    s.style.left=(20+Math.random()*60)+'vw';
    s.style.top=(25+Math.random()*45)+'vh';
    s.style.setProperty('--dx',(Math.random()*360-180)+'px');
    s.style.setProperty('--dy',(Math.random()*320-160)+'px');
    s.style.animationDelay=(Math.random()*.25)+'s';
    layer.appendChild(s);
  }
  if(rate>=90)celebrate();
  setTimeout(()=>layer.innerHTML='',1800);
}
function showComplete(){
  stopQuestionTimer();
  ['flashView','quizView','listView'].forEach(id=>$(id).classList.add('hidden'));
  $('completeView').classList.remove('hidden');
  const correct=state.daily.correct;
  const total=state.daily.count;
  const rate=total?Math.round(correct/total*100):0;
  $('resultScore').textContent=`${total}問中 ${correct}問正解`;
  $('resultRate').textContent=`正答率 ${rate}%`;
  $('resultIcon').textContent=rate>=90?'🏆':rate>=70?'🌟':'📘';
  $('resultTitle').textContent=rate>=90?'すばらしい結果です！':rate>=70?'今日の目標達成！':'50問、お疲れさまでした！';
  $('resultMessage').textContent=rate>=90?'高い正答率です。この調子で定着させましょう。':rate>=70?'よくできました。間違えた単語を復習するとさらに安定します。':'間違えた単語を中心に、もう一度確認してみましょう。';
  $('completeView').classList.remove('result-pop');
  void $('completeView').offsetWidth;
  $('completeView').classList.add('result-pop');
  resultAnimation(rate);
  resultSound(rate);
  save();
}

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
  return b;
}
function filteredWords(){
  const f=$('filter').value;
  if(bossMode)return bossWords();

  if(mode==='list'){
    return words.filter(x =>
      f==='all' ||
      (f==='due'&&isDue(x)) ||
      (f==='review'&&!state.mastered[x.w]) ||
      (f==='mastered'&&state.mastered[x.w])
    );
  }

  // 「今日の復習」だけは、習得済みでも復習日が来た単語を出題する。
  if(f==='due')return words.filter(isDue);

  // 「覚えた単語だけ」は一覧確認専用。
  if(f==='mastered')return [];

  // 通常学習では習得済み単語を出題しない。
  return words.filter(x=>!state.mastered[x.w]);
}
function rebuildDeck(){
  clearTimeout(advanceTimer);
  advanceTimer=null;
  deck=weightedDeck(filteredWords());
  index=0;
  render();
}
function removeMasteredFromDeck(w){
  deck=deck.filter(x=>x.w!==w);
  if(deck.length===0){index=0;return;}
  index=index%deck.length;
}
function currentWord(){return deck.length?deck[index%deck.length]:null}
function statsOf(w){return normalizeWordStats(w)}
function statsHtml(w){
  const s=statsOf(w);
  return `<span class="stat-chip">挑戦 ${s.attempts}回</span>
          <span class="stat-chip">正解 ${s.correct}回</span>
          <span class="stat-chip streak-chip">連続正解 ${s.streak} / 5</span><span class="stat-chip">Lv.${s.level}</span>
          ${isWeak(w)?'<span class="weak-badge">苦手</span>':''}`;
}

function errorsOf(w){
  const s=statsOf(w);
  return Math.max(0,s.attempts-s.correct);
}
function weakScore(w){
  const s=statsOf(w);
  const errors=errorsOf(w);
  return errors*3 + Math.max(0,4-s.streak);
}
function isWeak(w){
  const s=statsOf(w);
  return errorsOf(w)>=2 || (s.attempts>=3 && s.correct/Math.max(1,s.attempts)<0.7);
}
function weightedDeck(list){
  const weighted=[];
  list.forEach(x=>{
    const repeat=trainingMode ? Math.max(1,Math.min(5,1+errorsOf(x.w))) : (isWeak(x.w)?3:1);
    for(let i=0;i<repeat;i++)weighted.push(x);
  });
  return shuffle(weighted);
}
function hintHtml(x){
  const h=hintData[x.w]||{
    origin:"この単語は本文の文脈とコロケーションで覚えましょう。",
    image:`「${x.ja}」の場面を頭の中に描く`,
    memory:`${x.w} = ${x.ja}`,
    example:x.ex
  };
  return `<div class="hint-title">💡 覚え方ヒント</div>
    <div class="hint-grid">
      <div><div class="hint-label">語源</div><div class="hint-text">${h.origin}</div></div>
      <div><div class="hint-label">イメージ</div><div class="hint-text">${h.image}</div></div>
      <div><div class="hint-label">記憶フレーズ</div><div class="hint-text">${h.memory}</div></div>
      <div><div class="hint-label">例文</div><div class="hint-text">${h.example}</div></div>
    </div>`;
}
function showHintIfNeeded(targetId,x,force=false){
  const target=$(targetId);
  if(force || $('showHints').checked || isWeak(x.w)){
    target.innerHTML=hintHtml(x);
    target.classList.remove('hidden');
  }else{
    target.classList.add('hidden');
    target.innerHTML='';
  }
}

function updateStats(){
  ensureDaily();
  $('masteredCount').textContent=words.filter(x=>state.mastered[x.w]).length;
  $('dueCount').textContent=words.filter(isDue).length;
  $('todayCount').textContent=`${state.daily.count}/${DAILY_GOAL}`;
  $('dailyBar').style.width=Math.min(100,state.daily.count/DAILY_GOAL*100)+'%';
  $('goalTitle').textContent=bossMode?'👑 Boss Challenge：苦手5語':state.daily.finished?'今日の50問を完了しました':`今日の目標：${DAILY_GOAL}問`;
  $('goalNote').textContent=bossMode?'苦手な5語に集中して挑戦します。':'50問終了後に今日の正解数と正答率を表示します。';
  $('accuracy').textContent=state.total?Math.round(state.correct/state.total*100)+'%':'–';
}
function promptData(x){
  const en=$('direction').value==='en-ja';
  return {prompt:en?x.w:x.ja,answer:en?x.ja:x.w,ipa:en?x.ipa:''};
}
function speak(x){
  if(!x||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(x.w.replace(/\(.*?\)/g,'').trim());
  u.lang='en-US';u.rate=.82;
  const vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang&&v.lang.startsWith('en'))||null;
  speechSynthesis.speak(u);
}
function autoSpeak(x){if($('autoSpeak').checked&&$('direction').value==='en-ja')setTimeout(()=>speak(x),100)}

let ctx;
function tone(freq,start,dur,vol=.1,type='triangle'){
  if(!$('soundEffects').checked)return;
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,ctx.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+start+.012);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+dur);
  o.connect(g);g.connect(ctx.destination);
  o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+.04);
}
function correctSound(){
  [[523,0,.13],[659,.08,.14],[784,.16,.16],[1047,.26,.25],[1319,.38,.3]].forEach(x=>tone(...x,.12));
}
function wrongSound(){tone(220,0,.18,.08);tone(175,.15,.25,.08)}
function masteredSound(){
  [[523,0,.14],[659,.1,.15],[784,.2,.16],[1047,.31,.18],[1319,.43,.22],[1568,.57,.36]].forEach(x=>tone(...x,.13));
}
function celebrate(){
  const box=$('celebration');box.innerHTML='';
  const colors=['#f59e0b','#ef4444','#22c55e','#3b82f6','#a855f7'];
  for(let i=0;i<38;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];
    c.style.setProperty('--d',(Math.random()*220-110)+'px');c.style.animationDelay=Math.random()*.15+'s';
    box.appendChild(c);
  }
  setTimeout(()=>box.innerHTML='',1500);
}
function streakAnimation(streak,mastered=false){
  const layer=$('streakLayer');
  layer.innerHTML='';
  const pop=document.createElement('div');
  pop.className='streak-pop';
  pop.textContent=mastered?'🎉 5連続正解！習得！':streak>=2?`⭐ ${streak}連続正解！`:'✨ 正解！';
  layer.appendChild(pop);
  const count=mastered?18:Math.min(12,4+streak);
  for(let i=0;i<count;i++){
    const star=document.createElement('div');
    star.className='star-burst';
    star.textContent=i%3===0?'🌟':'⭐';
    star.style.setProperty('--r',(i*(360/count))+'deg');
    star.style.setProperty('--x',(80+Math.random()*150)+'px');
    star.style.animationDelay=(Math.random()*.12)+'s';
    layer.appendChild(star);
  }
  setTimeout(()=>layer.innerHTML='',1200);
}


function stopQuestionTimer(){
  clearTimeout(questionTimer);
  clearInterval(timerInterval);
  questionTimer=null;
  timerInterval=null;
}
function startQuestionTimer(x){
  stopQuestionTimer();
  questionStartedAt=performance.now();
  $('timerBar').style.transition='none';
  $('timerBar').style.width='100%';
  $('timerLabel').textContent='残り 4.0 秒';

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      $('timerBar').style.transition='width 4s linear';
      $('timerBar').style.width='0%';
    });
  });

  timerInterval=setInterval(()=>{
    const left=Math.max(0,4000-(performance.now()-questionStartedAt));
    $('timerLabel').textContent=`残り ${(left/1000).toFixed(1)} 秒`;
  },50);

  questionTimer=setTimeout(()=>handleTimeout(x),4000);
}
function handleTimeout(x){
  if(answered||mode!=='quiz')return;
  answered=true;
  stopQuestionTimer();

  state.total++;
  const s=statsOf(x.w);
  s.attempts++;
  s.streak=0;
  scheduleWrong(x);

  [...$('options').children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===($('direction').value==='en-ja'?x.ja:x.w))b.classList.add('correct');
  });

  $('feedback').textContent=`時間切れです。正解：${$('direction').value==='en-ja'?x.ja:x.w}`;
  $('feedback').style.color='var(--bad)';
  $('quizWordStats').innerHTML=statsHtml(x.w);
  showHintIfNeeded('quizHint',x,true);
  $('timerLabel').textContent='時間切れ';
  wrongSound();
  recordDaily(false);
  save();

  clearTimeout(advanceTimer);
  advanceTimer=setTimeout(()=>{
    advanceTimer=null;
    if(mode!=='quiz')return;
    const current=deck.splice(index%deck.length,1)[0];
    const at=Math.min(deck.length,index+2);
    deck.splice(at,0,current);
    if(index>=deck.length)index=0;
    if(bossMode&&index+1>=deck.length){
        state.daily.bossDone=true;
        bossMode=false;
        save();
        alert('ボス戦終了！ 苦手5語の練習が終わりました。');
        mode='quiz';
        rebuildDeck();
        return;
      }
    if(maybeFinishDaily())return;
    renderQuiz();
  },1300);
}

function render(){
  stopQuestionTimer();
  clearTimeout(advanceTimer);
  advanceTimer=null;
  $('completeView').classList.add('hidden');
  ['flashView','quizView','listView'].forEach(id=>$(id).classList.add('hidden'));
  $(mode+'View').classList.remove('hidden');
  if(mode==='flash')renderFlash();
  if(mode==='quiz')renderQuiz();
  if(mode==='list')renderList();
}
function showEmpty(target){
  target.textContent=$('filter').value==='review'?'覚えていない単語はありません。':$('filter').value==='mastered'?'覚えた単語は「単語一覧」で確認できます。習得済みの単語はフラッシュカード・4択クイズには再出題されません。':'該当する単語がありません。';
  $('bar').style.width='100%';
}
function renderFlash(){
  const x=currentWord();
  $('flashAnswerArea').classList.add('hidden');
  if(!x){
    showEmpty($('flashPrompt'));$('flashIpa').textContent='';$('flashWordStats').innerHTML='';$('flashControls').innerHTML='';return;
  }
  const p=promptData(x);
  $('flashCounter').textContent=`${index+1} / ${deck.length}`;
  $('flashWordStats').innerHTML=statsHtml(x.w);
  $('flashPrompt').textContent=p.prompt;$('flashIpa').textContent=p.ipa;
  $('flashAnswer').textContent=p.answer;$('flashExample').textContent=`${x.pos}　${x.ex}`;
  $('flashControls').innerHTML='<button id="showAnswer" class="btn primary">答えを見る</button>';
  $('showAnswer').onclick=()=>{
    $('flashAnswerArea').classList.remove('hidden');
    showHintIfNeeded('flashHint',x,true);
    $('flashControls').innerHTML='<button id="again" class="btn bad">もう一度</button><button id="nextFlash" class="btn good">覚えていた</button>';
    $('again').onclick=()=>recordFlash(false,x);
    $('nextFlash').onclick=()=>recordFlash(true,x);
  };
  $('speakFlash').onclick=()=>speak(x);
  $('bar').style.width=((index+1)/deck.length*100)+'%';
  autoSpeak(x);
  showHintIfNeeded('flashHint',x,false);
}
function recordFlash(ok,x){
  const s=statsOf(x.w);
  s.attempts++;
  if(ok){
    const wasMastered=!!state.mastered[x.w];
    s.correct++;s.streak++;
    if(wasMastered && $('filter').value==='due'){
      s.level=Math.min(6,Math.max(3,s.level+1));
      s.due=Date.now()+levelDelay(s.level);
    }else{
      scheduleCorrect(x);
    }
    const mastered=wasMastered || s.streak>=5;
    if(mastered){
      const firstMastery=!state.mastered[x.w];
      state.mastered[x.w]=true;
      if(firstMastery){
        s.level=1;
        s.due=nextLocalDayStart();
      }
    }
    streakAnimation(s.streak,mastered);
    if(mastered){masteredSound();celebrate()}else correctSound();
  }else{
    s.streak=0;wrongSound();
  }
  save();
  if(state.mastered[x.w]){
    removeMasteredFromDeck(x.w);
    if(deck.length===0){rebuildDeck();return;}
    renderFlash();
  }else{
    index=(index+1)%deck.length;
    renderFlash();
  }
}
function renderQuiz(){
  const x=currentWord();
  answered=false;$('feedback').textContent='';
  if(!x){
    showEmpty($('quizPrompt'));$('quizIpa').textContent='';$('quizWordStats').innerHTML='';$('options').innerHTML='';$('quizTimer').classList.add('hidden');return;
  }
  const p=promptData(x);
  $('quizTimer').classList.remove('hidden');
  $('quizCounter').textContent=`${index+1} / ${deck.length}`;
  $('quizWordStats').innerHTML=statsHtml(x.w);
  $('quizPrompt').textContent=p.prompt;$('quizIpa').textContent=p.ipa;
  const pool=shuffle(words.filter(y=>y.w!==x.w)).slice(0,3);
  const choices=shuffle([x,...pool]);
  $('options').innerHTML='';
  choices.forEach(y=>{
    const b=document.createElement('button');b.className='option';
    b.textContent=$('direction').value==='en-ja'?y.ja:y.w;
    b.onclick=()=>answerQuiz(b,y.w===x.w,x);
    $('options').appendChild(b);
  });
  $('speakQuiz').onclick=()=>speak(x);
  $('bar').style.width=((index+1)/deck.length*100)+'%';
  autoSpeak(x);
  showHintIfNeeded('quizHint',x,false);
  startQuestionTimer(x);
}
function answerQuiz(btn,ok,x){
  if(answered)return;
  answered=true;
  stopQuestionTimer();
  state.total++;
  const s=statsOf(x.w);
  s.attempts++;
  [...$('options').children].forEach(b=>b.disabled=true);

  if(ok){
    state.correct++;
    s.correct++;
    s.streak++;
    scheduleCorrect(x);
    const mastered=s.streak>=5;
    if(mastered){
      const firstMastery=!state.mastered[x.w];
      state.mastered[x.w]=true;
      if(firstMastery){
        s.level=1;
        s.due=nextLocalDayStart();
      }
    }

    btn.classList.add('correct');
    $('feedback').textContent=mastered?'5回連続正解！覚えた単語として除外しました！':`正解です！ ${s.streak}連続正解`;
    $('feedback').style.color='var(--good)';
    $('quizWordStats').innerHTML=statsHtml(x.w);
    streakAnimation(s.streak,mastered);
    if(mastered){masteredSound();celebrate()}else correctSound();
    recordDaily(true);
    save();

    clearTimeout(advanceTimer);
    advanceTimer=setTimeout(()=>{
      advanceTimer=null;
      if(mode!=='quiz')return;
      if(bossMode&&index+1>=deck.length){
        state.daily.bossDone=true;
        bossMode=false;
        save();
        alert('ボス戦終了！ 苦手5語の練習が終わりました。');
        mode='quiz';
        rebuildDeck();
        return;
      }
      if(maybeFinishDaily())return;
      if(mastered){
        removeMasteredFromDeck(x.w);
        if(deck.length===0){rebuildDeck();return;}
        renderQuiz();
      }else{
        index=(index+1)%deck.length;
        renderQuiz();
      }
    },mastered?1450:950);
  }else{
    s.streak=0;
    scheduleWrong(x);
    btn.classList.add('wrong');
    $('feedback').textContent=`不正解です。正解：${$('direction').value==='en-ja'?x.ja:x.w}`;
    $('feedback').style.color='var(--bad)';
    $('quizWordStats').innerHTML=statsHtml(x.w);
    showHintIfNeeded('quizHint',x,true);
    wrongSound();
    recordDaily(false);
    [...$('options').children].forEach(b=>{
      if(b.textContent===($('direction').value==='en-ja'?x.ja:x.w))b.classList.add('correct');
    });
    save();

    clearTimeout(advanceTimer);
    advanceTimer=setTimeout(()=>{
      advanceTimer=null;
      if(mode!=='quiz')return;
      const current=deck.splice(index%deck.length,1)[0];
      const at=Math.min(deck.length,index+2);
      deck.splice(at,0,current);
      if(index>=deck.length)index=0;
      if(bossMode&&index+1>=deck.length){
        state.daily.bossDone=true;
        bossMode=false;
        save();
        alert('ボス戦終了！ 苦手5語の練習が終わりました。');
        mode='quiz';
        rebuildDeck();
        return;
      }
      if(maybeFinishDaily())return;
      renderQuiz();
    },1300);
  }
}
function renderList(){
  clearTimeout(advanceTimer);advanceTimer=null;
  const list=filteredWords().sort((a,b)=>trainingMode?weakScore(b.w)-weakScore(a.w):a.w.localeCompare(b.w));
  $('wordList').innerHTML=list.map(x=>{
    const s=statsOf(x.w);
    return `<div class="row">
      <div><b>${x.w}</b><div class="small">${x.ipa}　${x.pos}</div></div>
      <div>${x.ja}<div class="small">${x.ex}</div>
        <div class="small" style="margin-top:5px">Lv.${s.level}｜挑戦 ${s.attempts}回｜正解 ${s.correct}回｜連続 ${s.streak}/5｜次回 ${new Date(s.due).toLocaleDateString()} ${isWeak(x.w)?'<span class="weak-badge">苦手</span>':''}</div>
      </div>
      <div>
        <span class="badge ${state.mastered[x.w]?'mastered':''}">${state.mastered[x.w]?'覚えた':'練習中'}</span>
        <button class="btn ${state.mastered[x.w]?'secondary':'remember'}" data-word="${encodeURIComponent(x.w)}">
          ${state.mastered[x.w]?'練習に戻す':'✓ 覚えた'}
        </button>
      </div>
    </div>`;
  }).join('')||'<div class="small">該当する単語がありません。</div>';

  document.querySelectorAll('[data-word]').forEach(btn=>btn.onclick=()=>{
    const w=decodeURIComponent(btn.dataset.word);
    if(state.mastered[w]){
      delete state.mastered[w];
      statsOf(w).streak=0;
    }else{
      state.mastered[w]=true;
      masteredSound();celebrate();
    }
    save();renderList();
  });
  $('bar').style.width='100%';
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');mode=t.dataset.mode;rebuildDeck();
});
$('direction').onchange=rebuildDeck;
$('filter').onchange=rebuildDeck;
$('bossBtn').onclick=startBoss;
$('continueBtn').onclick=()=>{state.daily.count=0;state.daily.correct=0;state.daily.finished=false;state.daily.bossDone=false;bossMode=false;mode='quiz';save();rebuildDeck()};
$('trainingBtn').onclick=()=>{
  trainingMode=!trainingMode;
  $('trainingBtn').textContent=trainingMode?'🔥 特訓中':'🔥 苦手特訓';
  $('trainingBtn').style.opacity=trainingMode?'1':'.9';
  rebuildDeck();
};
$('shuffleBtn').onclick=rebuildDeck;
$('resetBtn').onclick=()=>{
  if(confirm('学習履歴をすべて消しますか？')){
    state={mastered:{},correct:0,total:0,wordStats:{},daily:{date:todayKey(),count:0,correct:0,bossDone:false,finished:false}};
    words.forEach(x=>normalizeWordStats(x.w));
    save();rebuildDeck();
  }
};

save();
rebuildDeck();
</script>
